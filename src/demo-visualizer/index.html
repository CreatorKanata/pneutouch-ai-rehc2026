<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PneutouchAI — Touch brings it to life.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="video-stage" aria-label="恐竜のリアクション">
      <video id="idle-video" muted autoplay loop playsinline preload="auto" aria-label="待機中の恐竜動画"></video>
      <video id="reaction-video" muted playsinline preload="auto" aria-label="触れた部位のリアクション動画" hidden></video>
      <button id="play-video" class="play-video" hidden>▶ 動画を再生</button>
    </section>

    <aside class="hud" aria-label="恐竜のステータス">
      <header class="masthead">
        <a class="brand" href="./" aria-label="PneutouchAI"><img src="/images/logo/pneu-touch-ai-logo-256w.png" width="256" height="85" alt="PneuTouchAI"></a>
        <div class="connection-tools">
          <span id="connection" class="connection" data-state="off">未接続</span>
          <button id="connect" disabled>恐竜につなぐ ↗</button><button id="disconnect" class="subtle" hidden>切断</button>
        </div>
      </header>

      <section class="card touch-card" aria-label="恐竜の触れた場所">
        <div class="card-heading"><h1>触れたところ</h1><span id="phase-badge" class="small-pill">待機中</span></div>
        <div class="touch-body">
          <div class="status-stage" id="status-stage" data-phase="idle" data-part="">
            <img id="status-image" src="/images/demo/normal.jpg" width="1024" height="768" alt="待機中の恐竜のサイドビュー">
            <div class="touch-overlay">
              <div class="touch-result" aria-live="polite">
                <h2 id="part-ja">どこをさわる？</h2>
                <span id="reset-count" aria-label="表示が戻るまでの時間"></span>
              </div>
              <div class="legend"><span><i class="dot yellow"></i>押している</span><span><i class="dot red"></i>ここに触れた</span></div>
            </div>
            <p id="image-error" hidden>状態画像を読み込めません</p>
          </div>
        </div>
      </section>

      <p id="notice" class="notice" role="status" hidden></p>
    </aside>

    <div class="result-dock">
      <section id="waveform-card" class="card waveform-card" aria-label="推定したタッチの実測波形" hidden>
        <div class="card-heading"><h2>このタッチの波形</h2><span id="trace-label" class="small-pill">タッチを待っています</span></div>
        <div class="chart-stage">
          <canvas id="chart" aria-label="実センサーの圧力波形"></canvas>
          <div id="chart-empty"><span aria-hidden="true">∿</span><p>このタッチの波形データを<br>受信できませんでした。</p></div>
        </div>
        <div class="chart-foot"><span id="trace-detail">実際に受信したデータを表示します</span><span>ADC counts ／ 秒</span></div>
      </section>
      <nav class="view-tools" aria-label="動画の表示設定">
        <span id="video-label" class="video-label">いつもの恐竜</span>
        <button id="sound" class="glass-button" aria-pressed="false" aria-label="動画の音をオンにする">音 OFF</button>
        <button id="fullscreen" class="glass-button" aria-pressed="false" aria-label="ステータスと波形を含めて全画面にする">⛶ 全画面</button>
      </nav>
    </div>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
