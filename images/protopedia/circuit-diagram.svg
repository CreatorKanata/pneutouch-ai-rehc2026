<?xml version="1.0" encoding="UTF-8"?>
<!-- PneuTouch AI wiring diagram for ProtoPedia (16:9, 2x of 880x495). Created by Kanata the Kid Creator. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 990" width="1760" height="990"
     font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Hiragino Kaku Gothic Pro, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/>
    </marker>
    <marker id="arrow-air" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a8fd0"/>
    </marker>
  </defs>

  <rect width="1760" height="990" fill="#ffffff"/>

  <!-- Title -->
  <text x="50" y="70" font-size="42" font-weight="bold" fill="#1a202c">PneuTouch AI 回路図（配線図）</text>
  <text x="50" y="115" font-size="22" fill="#4a5568">空気圧センサー1個 ＋ ROHM Solist-AI で、触った場所を推定する</text>
  <text x="1710" y="70" font-size="20" fill="#718096" text-anchor="end">Created by Kanata the Kid Creator</text>

  <!-- Dinosaur -->
  <rect x="50" y="170" width="270" height="470" rx="18" fill="#f0fff4" stroke="#38a169" stroke-width="3"/>
  <text x="185" y="208" font-size="24" font-weight="bold" fill="#22543d" text-anchor="middle">TPU製 中空恐竜</text>
  <text x="185" y="237" font-size="15" fill="#2f855a" text-anchor="middle">7つの空気室（φ2.5mmの穴で連結）</text>
  <g stroke="#2a8fd0" stroke-width="5">
    <line x1="185" y1="296" x2="185" y2="308"/>
    <line x1="185" y1="348" x2="185" y2="360"/>
    <line x1="185" y1="400" x2="185" y2="412"/>
    <line x1="185" y1="452" x2="185" y2="464"/>
    <line x1="185" y1="504" x2="185" y2="516"/>
    <line x1="185" y1="556" x2="185" y2="568"/>
  </g>
  <g fill="#ffffff" stroke="#38a169" stroke-width="2">
    <rect x="80" y="256" width="210" height="40" rx="10"/>
    <rect x="80" y="308" width="210" height="40" rx="10"/>
    <rect x="80" y="360" width="210" height="40" rx="10"/>
    <rect x="80" y="412" width="210" height="40" rx="10"/>
    <rect x="80" y="464" width="210" height="40" rx="10"/>
    <rect x="80" y="516" width="210" height="40" rx="10"/>
    <rect x="80" y="568" width="210" height="40" rx="10"/>
  </g>
  <g font-size="20" fill="#22543d" text-anchor="middle">
    <text x="185" y="283">頭・首</text>
    <text x="185" y="335">背中</text>
    <text x="185" y="387">左後ろ足</text>
    <text x="185" y="439">左前足</text>
    <text x="185" y="491">右前足</text>
    <text x="185" y="543">右後ろ足</text>
    <text x="185" y="595">しっぽ</text>
  </g>

  <!-- Air tube -->
  <line x1="290" y1="588" x2="418" y2="588" stroke="#2a8fd0" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow-air)"/>
  <text x="360" y="668" font-size="18" fill="#2a8fd0" text-anchor="middle">空気チューブ</text>
  <line x1="360" y1="650" x2="360" y2="598" stroke="#2a8fd0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Sensor module -->
  <rect x="400" y="330" width="300" height="310" rx="14" fill="#ebf8ff" stroke="#3182ce" stroke-width="3"/>
  <text x="550" y="368" font-size="22" font-weight="bold" fill="#2a4365" text-anchor="middle">圧力センサーモジュール</text>
  <rect x="420" y="470" width="125" height="150" rx="10" fill="#ffffff" stroke="#3182ce" stroke-width="2"/>
  <text x="482" y="510" font-size="18" font-weight="bold" fill="#2a4365" text-anchor="middle">MPS20N</text>
  <text x="482" y="533" font-size="18" font-weight="bold" fill="#2a4365" text-anchor="middle">0040D</text>
  <text x="482" y="568" font-size="16" fill="#2c5282" text-anchor="middle">圧力センサー</text>
  <text x="482" y="590" font-size="16" fill="#2c5282" text-anchor="middle">空気圧→電圧</text>
  <rect x="575" y="400" width="110" height="220" rx="10" fill="#ffffff" stroke="#3182ce" stroke-width="2"/>
  <text x="630" y="440" font-size="20" font-weight="bold" fill="#2a4365" text-anchor="middle">HX710B</text>
  <text x="630" y="475" font-size="16" fill="#2c5282" text-anchor="middle">24bit</text>
  <text x="630" y="497" font-size="16" fill="#2c5282" text-anchor="middle">A/D変換</text>
  <text x="630" y="540" font-size="16" fill="#2c5282" text-anchor="middle">40回/秒</text>
  <g stroke="#3182ce" stroke-width="2">
    <line x1="545" y1="535" x2="575" y2="535"/>
    <line x1="545" y1="555" x2="575" y2="555"/>
  </g>

  <!-- Wires: module <-> CN3 -->
  <g stroke-width="4" fill="none">
    <path d="M685,430 H900" stroke="#d63b3b"/>
    <path d="M685,480 H900" stroke="#2d3748"/>
    <path d="M900,530 H689" stroke="#2b6cb0" marker-end="url(#arrow-blue)"/>
    <path d="M685,580 H896" stroke="#2f855a" marker-end="url(#arrow-green)"/>
  </g>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <text x="800" y="420" fill="#d63b3b">電源 3.3V</text>
    <text x="800" y="470" fill="#2d3748">GND</text>
    <text x="800" y="520" fill="#2b6cb0">SCK（クロック）</text>
    <text x="800" y="570" fill="#2f855a">DOUT（データ）</text>
  </g>

  <!-- Board -->
  <rect x="900" y="170" width="500" height="640" rx="18" fill="#fffaf0" stroke="#dd6b20" stroke-width="3"/>
  <text x="1150" y="210" font-size="21" font-weight="bold" fill="#7b341e" text-anchor="middle">DT-EBML63Q2557（ROHM 評価ボード）</text>

  <!-- JP1 -->
  <rect x="920" y="240" width="200" height="60" rx="8" fill="#ffffff" stroke="#d63b3b" stroke-width="2"/>
  <text x="1020" y="265" font-size="17" font-weight="bold" fill="#9b2c2c" text-anchor="middle">JP1：1-2を短絡</text>
  <text x="1020" y="288" font-size="16" fill="#9b2c2c" text-anchor="middle">センサー電源 = 3.3V</text>
  <path d="M1040,430 H1075 V300" stroke="#d63b3b" stroke-width="4" fill="none"/>

  <!-- CN3 -->
  <text x="970" y="385" font-size="19" font-weight="bold" fill="#7b341e" text-anchor="middle">CN3</text>
  <rect x="900" y="395" width="140" height="220" rx="6" fill="#ffffff" stroke="#dd6b20" stroke-width="2"/>
  <g font-size="18" fill="#2d3748">
    <text x="918" y="437">5番　3.3V</text>
    <text x="918" y="487">11番　GND</text>
    <text x="918" y="537">12番　P40</text>
    <text x="918" y="587">10番　P42</text>
  </g>
  <g>
    <circle cx="900" cy="430" r="7" fill="#d63b3b"/>
    <circle cx="900" cy="480" r="7" fill="#2d3748"/>
    <circle cx="900" cy="530" r="7" fill="#2b6cb0"/>
    <circle cx="900" cy="580" r="7" fill="#2f855a"/>
  </g>

  <!-- GND symbol -->
  <g stroke="#2d3748" stroke-width="3" fill="none">
    <path d="M1040,480 H1070 V494"/>
    <line x1="1056" y1="494" x2="1084" y2="494"/>
    <line x1="1061" y1="501" x2="1079" y2="501"/>
    <line x1="1066" y1="508" x2="1074" y2="508"/>
  </g>

  <!-- CN3 -> MCU -->
  <path d="M1150,530 H1044" stroke="#2b6cb0" stroke-width="4" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1040,580 H1146" stroke="#2f855a" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>
  <text x="1115" y="520" font-size="15" fill="#2b6cb0" text-anchor="middle">出力</text>
  <text x="1095" y="572" font-size="15" fill="#2f855a" text-anchor="middle">入力</text>

  <!-- LCD -->
  <rect x="1150" y="230" width="230" height="70" rx="8" fill="#ffffff" stroke="#dd6b20" stroke-width="2"/>
  <text x="1265" y="258" font-size="19" font-weight="bold" fill="#7b341e" text-anchor="middle">LCD（結果を3秒表示）</text>
  <text x="1265" y="284" font-size="15" fill="#7b341e" text-anchor="middle">HEAD / BACK / LEGS / TAIL</text>
  <line x1="1265" y1="300" x2="1265" y2="330" stroke="#805ad5" stroke-width="4"/>
  <text x="1277" y="322" font-size="16" font-weight="bold" fill="#805ad5">I2C</text>

  <!-- MCU -->
  <rect x="1150" y="330" width="230" height="300" rx="10" fill="#2d3748" stroke="#1a202c" stroke-width="3"/>
  <text x="1265" y="372" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">ML63Q2557</text>
  <text x="1265" y="402" font-size="17" fill="#e2e8f0" text-anchor="middle">Arm Cortex-M0+</text>
  <rect x="1175" y="425" width="180" height="90" rx="8" fill="#f6ad55" stroke="#dd6b20" stroke-width="2"/>
  <text x="1265" y="462" font-size="23" font-weight="bold" fill="#1a202c" text-anchor="middle">Solist-AI</text>
  <text x="1265" y="493" font-size="16" fill="#1a202c" text-anchor="middle">チップ上で学習・推論</text>
  <text x="1265" y="552" font-size="16" fill="#e2e8f0" text-anchor="middle">波形から12特徴量</text>
  <text x="1265" y="577" font-size="16" fill="#e2e8f0" text-anchor="middle">→ 4つの部位に分類</text>
  <text x="1265" y="610" font-size="14" fill="#a0aec0" text-anchor="middle">RAM 16KB</text>

  <!-- UART / FT2232H -->
  <line x1="1265" y1="630" x2="1265" y2="680" stroke="#805ad5" stroke-width="4"/>
  <text x="1277" y="662" font-size="16" font-weight="bold" fill="#805ad5">UART</text>
  <rect x="1150" y="680" width="230" height="90" rx="8" fill="#ffffff" stroke="#dd6b20" stroke-width="2"/>
  <text x="1265" y="710" font-size="20" font-weight="bold" fill="#7b341e" text-anchor="middle">FT2232H</text>
  <text x="1265" y="735" font-size="16" fill="#7b341e" text-anchor="middle">USB-UART変換（ch.B）</text>
  <text x="1265" y="758" font-size="16" fill="#7b341e" text-anchor="middle">115200bps / 8N1</text>
  <text x="1265" y="795" font-size="16" font-weight="bold" fill="#7b341e" text-anchor="middle">CN9（USB Type-C）→</text>

  <!-- CN2 / SWD -->
  <rect x="920" y="700" width="140" height="70" rx="8" fill="#ffffff" stroke="#dd6b20" stroke-width="2"/>
  <text x="990" y="730" font-size="19" font-weight="bold" fill="#7b341e" text-anchor="middle">CN2</text>
  <text x="990" y="754" font-size="16" fill="#7b341e" text-anchor="middle">SWD</text>
  <path d="M1060,735 H1105 V655 H1190 V630" stroke="#718096" stroke-width="4" fill="none"/>

  <!-- USB to PC -->
  <line x1="1380" y1="725" x2="1500" y2="725" stroke="#805ad5" stroke-width="5"/>
  <rect x="1390" y="708" width="22" height="34" rx="4" fill="#805ad5"/>
  <text x="1456" y="712" font-size="17" font-weight="bold" fill="#805ad5" text-anchor="middle">USB</text>
  <text x="1456" y="750" font-size="14" fill="#805ad5" text-anchor="middle">通信＋給電</text>

  <!-- PC -->
  <rect x="1500" y="300" width="220" height="480" rx="18" fill="#faf5ff" stroke="#805ad5" stroke-width="3"/>
  <text x="1610" y="348" font-size="28" font-weight="bold" fill="#44337a" text-anchor="middle">PC</text>
  <text x="1610" y="388" font-size="18" fill="#553c9a" text-anchor="middle">Chrome / Edge</text>
  <text x="1610" y="415" font-size="18" fill="#553c9a" text-anchor="middle">Web Serial API</text>
  <rect x="1520" y="445" width="180" height="170" rx="10" fill="#ffffff" stroke="#805ad5" stroke-width="2"/>
  <text x="1610" y="480" font-size="19" font-weight="bold" fill="#44337a" text-anchor="middle">デモ画面</text>
  <g font-size="17" fill="#553c9a" text-anchor="middle">
    <text x="1610" y="516">恐竜の反応動画</text>
    <text x="1610" y="546">触った部位の表示</text>
    <text x="1610" y="576">圧力の波形</text>
  </g>
  <text x="1610" y="680" font-size="18" font-weight="bold" fill="#4a5568" text-anchor="middle">LEXIDE-Ω</text>
  <text x="1610" y="706" font-size="16" fill="#4a5568" text-anchor="middle">（開発環境）</text>

  <!-- MCU-LINK -->
  <line x1="990" y1="770" x2="990" y2="850" stroke="#718096" stroke-width="4"/>
  <rect x="880" y="850" width="220" height="90" rx="12" fill="#f7fafc" stroke="#718096" stroke-width="3"/>
  <text x="990" y="887" font-size="22" font-weight="bold" fill="#2d3748" text-anchor="middle">MCU-LINK</text>
  <text x="990" y="916" font-size="16" fill="#4a5568" text-anchor="middle">書き込み・デバッグ</text>
  <path d="M1100,895 H1610 V780" stroke="#718096" stroke-width="4" fill="none"/>
  <text x="1350" y="883" font-size="17" font-weight="bold" fill="#718096" text-anchor="middle">USB（開発時のみ使用）</text>

  <!-- Notes -->
  <rect x="50" y="700" width="780" height="240" rx="14" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/>
  <text x="75" y="740" font-size="22" font-weight="bold" fill="#1a202c">配線のポイント</text>
  <g font-size="19" fill="#2d3748">
    <text x="75" y="780">・センサーは1個だけ。恐竜の中に電子部品や配線はありません</text>
    <text x="75" y="814">・しっぽの先からチューブで空気圧をセンサーへ伝えます</text>
    <text x="75" y="848">・センサーの電源は3.3V（CN3に5Vの信号は入れません）</text>
    <text x="75" y="882">・SCKとDOUTはマイコンのGPIO（P40 / P42）で直接読み取ります</text>
    <text x="75" y="916">・推定はボードだけで動作。PCは結果を表示する役割です</text>
  </g>
</svg>
